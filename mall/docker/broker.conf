brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# broker 注册到 namesrv、随后下发给客户端的地址，必须对「容器内后端」与「宿主机后端」同时可达：
#   - 容器内：host.docker.internal 解析为 Docker 网关，经宿主机端口映射回到 10911
#   - 宿主机：host.docker.internal 解析为宿主机网卡 IP，直接命中 10911 映射
# 早期写死 127.0.0.1 只适用于「后端跑在宿主机」，后端进容器后 127.0.0.1 指向容器自身，
# 会导致发消息报 RemotingConnectException（延迟关单等 MQ 功能不可用）。
brokerIP1 = host.docker.internal
autoCreateTopicEnable = true
