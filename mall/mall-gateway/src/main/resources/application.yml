server:
  port: 10010

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      enabled: true
      eager: true
      filter:
        enabled: true
    gateway:
      routes:
        # 业务微服务：商户/管理员/退款/统计/商品/订单/用户/资金
        - id: mall-mgr
          uri: lb://mall-mgr
          predicates:
            - Path=/mch/**,/admin/**,/statis/**,/refund/**,/goods/**,/order/**,/user/**,/fund/**,/category/**,/captcha/**,/uploads/**
        # 支付微服务：统一支付下单/回调/订单查询
        - id: mall-alipay
          uri: lb://mall-alipay
          predicates:
            - Path=/pay/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms

mallx:
  # 高并发防护：Redis+Lua 原子限流（QPS >= 1000）
  rate-limit:
    enabled: true
    global-qps: ${RATE_LIMIT_GLOBAL_QPS:1000}
    ip-qps: ${RATE_LIMIT_IP_QPS:200}

logging:
  level:
    root: info
    com.mallx: debug
